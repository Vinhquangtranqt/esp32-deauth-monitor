name: Build ESP32 Firmware

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v3.3

    steps:
    # Thay thế hoàn toàn actions/checkout bằng lệnh git clone thủ công
    - name: Clone Repository Manually
      run: |
        git clone --recursive https://github.com project
        
    - name: Build Firmware
      run: |
        cd project
        . /opt/esp/idf/export.sh
        make defconfig
        make all

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32-deauth-firmware
        path: |
          project/build/esp32-deauth-monitor.bin
          project/build/bootloader/bootloader.bin
          project/build/partitions_singleapp.bin
